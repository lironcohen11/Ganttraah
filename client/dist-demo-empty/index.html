itle:`ברוכים הבאים ל-Ganttraah`,text:`סיור קצר של חצי דקה: מה יש כאן ואיך עובדים. אפשר לדלג בכל רגע.`},{target:`[data-tour="nav"]`,title:`המסכים`,text:`תכנית עבודה: לעבודה היומיומית. מפת תלויות: מה משפיע על משימה ועל מה היא משפיעה. תצוגת מנהלים: למסך הגדול בחדר הישיבות.`},{target:`[data-tour="add"]`,pic:`create`,title:`יצירה`,text:`מכאן יוצרים משימה, תת-משימה או אבן דרך. משימה חדשה שייכת למסגרת שלך.`},{target:`.g-table`,action:`sample-on`,title:`רשימת המשימות`,text:`המשימות מקובצות לפי תחומים, והחץ פותח וסוגר תחום. המספור מראה לאיזה תחום משימה שייכת, לא את סדר הביצוע.`},{target:`.g-chart`,pic:`timeline`,title:`ציר הזמן`,text:`גוררים פס כדי להזיז משימה, ומושכים את הקצה שלו כדי לשנות את המשך. כדי לקשר, גוררים מהעיגול שבקצה הפס אל משימה אחרת. במשימה שנבחרה, הירוק מראה עד מתי אפשר לדחות בלי להזיז אחרות.`},{target:`.g-chart`,pic:`highlight`,title:`מה קשור למשימה`,text:`לחיצה על משימה צובעת בכתום את מה שמשפיע עליה, ובסגול את מה שהיא משפיעה עליו.`},{target:`[data-tour="undo"]`,pic:`undo`,title:`טעיתם?`,text:`החיצים מבטלים ומחזירים את הפעולה האחרונה. אפשר גם עם Ctrl+Z.`},{target:`[data-tour="filters"]`,title:`פרויקטים ומועדפים`,text:`כאן מופיעים הפרויקטים שלך. לחיצה מציגה רק אותם. משימות שסימנת בכוכב מוצגות בכפתור "מועדפים".`},{target:`[data-tour="owners"]`,title:`אחראים ומקרא`,text:`בכניסה מוצגות המשימות של המסגרת שלך ושל המסגרות שמתחתיה. מכאן משנים את זה, וחוזרים בלחיצה אחת למשימות שלך. "מקרא" מסביר כל סימון בגאנט.`},{target:`[data-tour="help"]`,title:`זהו!`,text:`אפשר לחזור לסיור בכל זמן מהכפתור הזה. לכל מסך יש סיור משלו: בכל מסך הכפתור מסביר את המסך שבו נמצאים.`}],fi=[{target:`[data-tour="m-kpis"]`,action:`sample-on`,title:`המספרים החשובים`,text:`כמה משימות הושלמו, מתי צפוי הסיום, מה דורש תשומת לב, ומהי אבן הדרך הבאה.`},{target:`[data-tour="m-timeline"]`,action:`reset`,title:`ציר הזמן`,text:`כל פס הוא שלב בעבודה, וצבע הפס הוא המצב שלו: ירוק בזמן, אדום באיחור.`},{target:`.mt-row.popped .mt-hit|.mt-stack`,need:`[data-tour="m-timeline"] .mt-row`,action:`pop`,title:`מה משפיע ועל מה`,text:`עומדים עם העכבר שנייה על פס, ולידו קופצות המשימות שמשפיעות עליו (מימין, בכתום) והמשימות שמושפעות ממנו (משמאל, בסגול). לחיצה על אחת מהן פותחת את הפרטים שלה.`},{target:`.mt-row.tour-hl`,need:`[data-tour="m-timeline"] .mt-row`,action:`open`,title:`מה יש בתוך שלב`,text:`לחיצה על שלב פותחת מתחתיו את המשימות שבתוכו. לחיצה נוספת סוגרת.`},{target:`[data-tour="m-tools"]`,title:`הגדרות ומסך מלא`,text:`בגלגל השיניים בוחרים מה להציג. הכפתור שלידו פותח מסך מלא לחדר הישיבות.`}],pi=[{target:`[data-tour="f-pick"]`,title:`בוחרים משימה`,text:`מקלידים שם של משימה, והמפה נבנית סביבה. אפשר להגיע לכאן גם בלחיצה כפולה על משימה בתכנית העבודה.`},{target:`.impact`,need:``,pic:`deps`,title:`איך קוראים את המפה`,text:`במרכז המשימה שבחרת. מימין, בכתום, המשימות שמשפיעות עליה. משמאל, בסגול, המשימות שהיא משפיעה עליהן. עמידה על כרטיס מדגישה את הקווים שלו, ולחיצה עוברת אליו.`},{target:`.ccard`,title:`המשימה במרכז`,text:`התאריכים, המשך והאחראי, ומה יש בתוכה. מכאן עוברים גם לגאנט או לפרטים המלאים.`},{target:`[data-tour="f-whatif"]`,need:``,pic:`whatif`,title:`מה קורה אם…`,text:`בוחרים שהמשימה מתעכבת בכמה ימים, או שהיא לא מתבצעת בכלל, ורואים מראש אילו משימות יזוזו ובכמה. זו רק הדמיה: התוכנית לא משתנה.`}],mi=[{target:`[data-tour="s-workdays"]`,title:`ימי עבודה`,text:`משך המשימות נספר בימי עבודה בלבד, א'-ה'. כל חג או יום מיוחד מזיז את התאריכים לבד.`},{target:`[data-tour="s-holidays"]`,title:`חגים ומועדים`,text:`כאן נקבע אילו חגים הם ימי חופש. רק הנהלת הענף משנה את זה.`},{target:`[data-tour="s-special"]`,title:`ימים מיוחדים`,text:`יום חופש או טווח של כמה ימים. יום של מסגרת משפיע רק על המשימות שלה ושל מי שמתחתיה, וכולם רואים אותו ברשימה.`},{target:`[data-tour="s-list"]`,title:`החגים של השנה`,text:`כל החגים והמועדים של השנה הנוכחית והבאה. הקו האדום מראה איפה אנחנו היום.`},{target:`[data-tour="s-org"]`,title:`מבנה ארגוני והרשאות`,text:`בלשונית הזו הנהלת הענף עורכת את המסגרות, מעבירה צוותים בגרירה, וקובעת לכל מסגרת אם היא צופה או עורכת. ללשונית יש סיור משלה: פותחים אותה ולוחצים שוב על "סיור במסך".`}],hi=[{target:`.org-tree.edit`,title:`המבנה הארגוני`,text:`כל המסגרות של הענף, כמו בדף הכניסה. כל שינוי כאן מופיע מיד בתכנית העבודה, בסינונים ובבחירת האחראי.`},{target:`.ou-card.section .ou-top`,title:`שינוי שם ומחיקה`,text:`העיפרון משנה את שם המסגרת, והפח מוחק אותה. אי אפשר למחוק מסגרת שיש באחריותה משימות פתוחות: קודם מעבירים אותן למסגרת אחרת. משימות שהושלמו עוברות למסגרת שמעליה.`},{target:`.ou-card.section .ou-meta`,title:`משימות והרשאה`,text:`כמה משימות פתוחות יש באחריות המסגרת. לחיצה על המספר מציגה אותן, ולחיצה על משימה פותחת אותה בתכנית העבודה. בתיבה בוחרים הרשאה: "צופה" עורכת רק את המשימות שלה ושל מי שמתחתיה, ו"עורך" עורכת גם משימות של אחרים.`},{target:`.ou-card.team`,title:`העברה בגרירה`,text:`גוררים צוות מהידית שליד השם ומשחררים על מדור אחר, והצוות עובר אליו עם כל המשימות שלו.`},{target:`.ou-card.section`,action:`org-add`,title:`הוספת מסגרת`,text:`כשהעכבר על מסגרת, מתחתיה מופיע הכפתור "+ צוות" (או "+ מדור" בהנהלת הענף), שמוסיף מסגרת חדשה תחתיה.`},{target:`[data-tour="s-delays"]`,title:`דחיית משימות`,text:`כשזה מסומן, דחייה של משימה שיש לה תכנון מקורי מבקשת סיבה. אפשר לכבות.`},{target:`[data-tour="s-pw"]`,title:`סיסמת הנהלת הענף`,text:`רק הכניסה כהנהלת הענף מוגנת בסיסמה. כאן מחליפים אותה: מזינים פעמיים את הסיסמה החדשה.`},{target:`.perm-note`,title:`מה כל הרשאה אומרת`,text:`ההסבר המלא נמצא כאן תמיד. ההגדרות והפרויקטים נשארים בידי הנהלת הענף בכל מקרה.`}],gi=[{target:`.hist-title .seg`,title:`שתי לשוניות`,text:`כל השינויים בתוכנית, או רק מה שנדחה ולמה.`},{target:`.hist-filters`,title:`סינון`,text:`לפי פרויקט, מי שינה וסוג פעולה. לחיצה על שורה מראה אילו משימות זזו בעקבותיה.`},{target:`.dl-head`,title:`מה נדחה ולמה`,text:`בוחרים במשפט עצמו סיבה אחת או כמה, ופרויקט אחד או כמה.`},{target:`.dl-bar`,title:`אחראי ומשימות שזזו`,text:`סינון לפי אחראי. אפשר להוסיף גם משימות שזזו בגלל דחייה של משימה אחרת.`},{target:`.dl-item`,title:`כרטיס דחייה`,text:`בכמה ימים נדחתה, מתי ומה הסיבה. לחיצה על השם פותחת את המשימה.`}];function _i({onClose:e,steps:t=di}){let n=t.filter(e=
